spring:
  datasource:
    url: jdbc:h2:mem:honestroom_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: HonestRoomTestSecretKeyMustBeAtLeast32BytesLongForHS256SigningTestOnly2026
    expiration-ms: 3600000
    cookie-name: honestroom_jwt
    cookie-secure: false
  cors:
    frontend-url: http://localhost:5173
  rate-limit:
    public-feedback-max-requests: 50
    public-feedback-window-seconds: 60
